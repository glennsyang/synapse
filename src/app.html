<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link rel="icon" href="%sveltekit.assets%/icons/icon-192.png" sizes="any" type="image/png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-192.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Synapse - Your Personal Second Brain" />
		<meta name="application-name" content="Synapse" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="theme-color" content="#2e3a6b" />
		<!-- Pre-paint dark-mode class, mirroring mode-watcher's setInitialMode. <ModeWatcher>'s own
		     head script can't carry the CSP nonce, so it's disabled and this nonced copy runs instead. -->
		<script nonce="%sveltekit.nonce%">
			const mode = localStorage.getItem('mode-watcher-mode') ?? 'system';
			const dark =
				mode === 'dark' ||
				(mode === 'system' && !window.matchMedia('(prefers-color-scheme: light)').matches);
			document.documentElement.classList.toggle('dark', dark);
			document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
		</script>
		<title>Synapse</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
