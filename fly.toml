# fly.toml app configuration file generated for synapse-dev on 2026-02-09T10:57:33-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'synapse-dev'
primary_region = 'yyz'

[build]

[processes]
  app = './start.sh'
  cron = 'supercronic /app/crontab'

[[mounts]]
  source = 'data'
  destination = '/data'
  processes = ['app']

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '1m0s'
    timeout = '5s'
    grace_period = '10s'
    method = 'get'
    path = '/api/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
